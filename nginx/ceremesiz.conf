# Ceremesiz Holding – Nginx-Site (Beispiel)
# Ablage z. B. unter /etc/nginx/conf.d/ceremesiz.conf
# Zertifikate z. B. per: certbot --nginx -d ceremesiz-holding.de -d www.ceremesiz-holding.de

server {
    listen 80;
    server_name ceremesiz-holding.de www.ceremesiz-holding.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ceremesiz-holding.de www.ceremesiz-holding.de;

    ssl_certificate     /etc/letsencrypt/live/ceremesiz-holding.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceremesiz-holding.de/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # Website, Login-API und interner Bereich werden vom Node-Backend ausgeliefert.
    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

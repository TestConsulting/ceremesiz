<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" sizes="32x32" href="/favicon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ceremesiz Holding Intern</title>
<meta name="robots" content="noindex,nofollow">
<!--__BOOT__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: öffentliche Holding-Startseite mit Login → interner Bereich mit Navy-Sidebar (nach Gesellschaft gruppiert) und hellem Arbeitsbereich */
/* Layout: helle Holding-Optik nach Logo – Weiß, Schwarz, Holding-Grün; Sidebar hell, nach Gesellschaft gruppiert. Bewusst nur helles Theme, damit das Logo überall korrekt steht. */
:root{
  color-scheme:light;
  --bg:#f4f6f4;--surface:#ffffff;--surface-2:#f8faf8;--ink:#111513;--muted:#59625c;--line:#dde3de;--field:#eef2ef;
  --navy:#111513;--navy-2:#e7f3ec;--side-ink:#111513;--side-muted:#6b756f;
  --brass:#00873a;--brass-ink:#006a2d;--brass-soft:#e5f2ea;--on-brass:#ffffff;
  --good:#1f7a4a;--good-soft:#e2f1e8;--warn:#9a6210;--warn-soft:#fbf0dc;--bad:#b23838;--bad-soft:#f8e4e4;
  --ins:#d9efe1;--ins-ink:#16603a;--del:#f6dede;--del-ink:#9b2c2c;
  --c-holding:#00873a;--detail:#fbf5e6;--c-person:#3a423d;--c-immo:#a0702a;--c-tc:#2b5c9e;--c-ppt:#cc6a22;
  --paper:#ffffff;--shadow:0 1px 2px rgba(17,21,19,.06),0 6px 20px rgba(17,21,19,.06);
  --f-display:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--field)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--field);color:var(--muted)}
.pill.brass{background:var(--brass-soft);color:var(--brass-ink)}
.chip{display:inline-flex;padding:3px 9px;border-radius:6px;font-size:12px;background:var(--field);border:1px solid var(--line)}
.chip.hit{background:var(--ins);color:var(--ins-ink);border-color:transparent}
.chip.gap{background:var(--del);color:var(--del-ink);border-color:transparent}

/* ---------- Öffentliche Seite ---------- */
#public{min-height:100%;display:flex;flex-direction:column}
.pub-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);padding-block:14px;padding-inline:max(16px,4vw);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wordmark{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.monogram{width:38px;height:38px;border:1.5px solid var(--brass);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--brass);border-radius:2px;flex:none}
.wordmark b{font-weight:700;letter-spacing:.22em;font-size:13px;display:block}
.wordmark small{font-size:10px;letter-spacing:.3em;color:var(--side-muted);display:block}
.pub-links{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.pub-links a{color:var(--side-ink);text-decoration:none;font-size:13px;opacity:.85}
.pub-links a:hover{opacity:1;color:var(--brass)}
.hero{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);padding-block:64px 72px;padding-inline:max(16px,4vw)}
.hero-in{max-width:1100px;margin:0 auto;display:grid;gap:22px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,6vw,68px);line-height:1.04;max-width:18ch;color:var(--ink)}
.hero h1 em{color:var(--brass);font-style:normal;display:block}
.hero p{max-width:58ch;color:var(--muted);font-size:16px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn{background:var(--surface);color:var(--ink);border-color:var(--line)}
.hero .btn.primary{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.pub-sec{background:var(--bg);padding-block:56px;padding-inline:max(16px,4vw)}
.pub-sec-in{max-width:1100px;margin:0 auto;display:grid;gap:26px}
.pub-sec h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,40px)}
.co-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.co-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--co);padding:22px;border-radius:8px;display:grid;gap:8px;align-content:start}
.co-card h3{font-size:16px}
.co-card p{margin:0;color:var(--muted);font-size:13.5px}
.pub-foot{margin-top:auto;border-top:1px solid var(--line);padding-block:22px;padding-inline:max(16px,4vw);color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

/* ---------- Login ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,12,22,.62);display:grid;place-items:center;padding:16px;z-index:50}
.login{width:min(420px,100%);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.login-head{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);padding:26px 28px;display:grid;gap:14px}
.login-head h2{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--ink)}
.login form{padding:24px 28px 28px;display:grid;gap:14px}
.hint{font-size:12px;color:var(--muted);background:var(--field);padding:8px 10px;border-radius:6px}

/* ---------- Formfelder ---------- */
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:4px;align-items:center}
.req{color:var(--bad);font-weight:700}
.inp{display:flex;align-items:center;background:var(--field);border:1px solid transparent;border-radius:7px;overflow:hidden}
.inp:focus-within{border-color:var(--brass);background:var(--surface)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;background:transparent;padding:9px 11px;outline:none}
.inp .u{padding:0 11px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.inp input[type=number]{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.field.missing .inp{border-color:var(--bad);background:var(--bad-soft)}
.field.missing label{color:var(--bad)}
textarea{resize:vertical}

/* ---------- App-Rahmen ---------- */
#app{display:grid;grid-template-columns:256px 1fr;min-height:100%}
#side{background:var(--surface);color:var(--ink);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .wordmark{padding:0 6px 14px;border-bottom:1px solid var(--line)}
.nav-grp{display:grid;gap:2px}
.nav-grp-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:4px 10px;display:flex;align-items:center;gap:8px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 26px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13.5px;opacity:.8}
.nav a.top{padding-left:10px}
.nav a:hover{background:var(--field);opacity:1}
.nav a.on{background:var(--brass-soft);opacity:1;box-shadow:inset 3px 0 0 var(--brass);color:var(--brass-ink);font-weight:700}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brass);color:var(--on-brass);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.side-foot .who{flex:1;min-width:0;font-size:12.5px}
.side-foot .who small{display:block;color:var(--side-muted)}
.side-foot button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
main{padding-block:28px 60px;padding-inline:clamp(16px,3vw,40px);max-width:1360px;width:100%;display:grid;gap:22px;align-content:start}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.2vw,38px);line-height:1.1;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.panel>h2,.panel-h h2{font-size:15px;font-weight:700}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--brass-soft);border-color:transparent}
.pos{color:var(--good)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse}
.tbl-wrap{overflow-x:auto}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr.sum td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;z-index:80;box-shadow:var(--shadow)}

/* Dashboard */
.co-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.co-tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;align-content:start;position:relative;overflow:hidden}
.co-tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--co)}
.co-tile h3{font-size:15.5px}
.co-tile .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.co-tile .stats div{display:grid;gap:2px}
.co-tile .stats b{font-family:var(--f-mono);font-weight:500;font-size:17px}
.co-tile .stats span{font-size:11.5px;color:var(--muted)}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.mod-link{font-size:12.5px;padding:6px 10px;border-radius:6px;background:var(--field);text-decoration:none;color:var(--ink);font-weight:600}
.mod-link:hover{background:var(--brass-soft);color:var(--brass-ink)}

/* Rendite */
.calc-grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
.calc-form{display:grid;gap:18px}
.fgrp{display:grid;gap:10px}
.fgrp h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-ink);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.calc-out{display:grid;gap:16px;min-width:0}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;font-size:13px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.kv td:first-child{color:var(--muted)}
.kv td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pot-list{display:grid;gap:8px;margin-top:12px}
.pot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line);font-size:13px}
.pot b{font-family:var(--f-mono);font-weight:500;white-space:nowrap}

/* Rente */
.chart-wrap{overflow-x:auto}
.chart-wrap svg{min-width:620px;width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.obj-tbl input,.obj-tbl select{background:var(--field);border:1px solid transparent;border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.obj-tbl input[type=number]{text-align:right;font-family:var(--f-mono)}
.obj-tbl input:focus,.obj-tbl select:focus{border-color:var(--brass);outline:none}
tr.goal td{background:var(--good-soft)}
tr.first td{box-shadow:inset 0 2px 0 var(--good)}

/* Vertrieb */
.vt-grid{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.emp-list{display:grid;gap:8px}
.emp{display:flex;gap:11px;align-items:center;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.emp:hover{border-color:var(--brass)}
.emp.on{border-color:var(--brass);background:var(--brass-soft)}
.emp .avatar{background:var(--c-tc);color:#fff}
.emp-meta{min-width:0;flex:1}
.emp-meta b{display:block;font-size:13.5px}
.emp-meta small{color:var(--muted);font-size:12px;display:block}
.steps{display:grid;gap:14px}
.step-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.step-n{width:24px;height:24px;border-radius:50%;background:var(--brass);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:18px;display:grid;gap:8px;justify-items:center;text-align:center;background:var(--surface-2);cursor:pointer}
.drop:hover{border-color:var(--brass)}
.drop input{display:none}
.progress{display:grid;gap:6px;font-size:13px}
.progress div{display:flex;gap:8px;align-items:center}
.score{display:flex;align-items:center;gap:14px}
.bar{height:8px;border-radius:99px;background:var(--field);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;background:var(--field);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.switch input{accent-color:var(--brass);width:16px;height:16px}
.cv{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:clamp(18px,4vw,44px);box-shadow:var(--shadow);display:grid;gap:18px;max-width:820px}
.cv-head{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--c-tc);padding-bottom:14px;flex-wrap:wrap}
.cv-head h2{font-family:var(--f-display);font-weight:400;font-size:32px}
.cv-head .role{color:var(--c-tc);font-weight:600}
.cv h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-tc);margin:0 0 8px}
.cv p{margin:0}
.cv-proj{display:grid;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cv-proj:last-child{border-bottom:0}
.cv-proj .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cv-proj ul{margin:4px 0 0;padding-left:18px}
.cv ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;padding:0 2px;border-radius:2px}
.cv del{background:var(--del);color:var(--del-ink);padding:0 2px;border-radius:2px}
.cv .moved{box-shadow:inset 3px 0 0 var(--warn);padding-left:8px}
.cv .chip.moved{box-shadow:none;padding-left:9px;outline:1.5px solid var(--warn)}
.cv.clean del{display:none}
.cv.clean ins{background:none;color:inherit;padding:0}
.cv.clean .moved{box-shadow:none;padding-left:0}
.cv.clean .chip.moved{outline:none;padding-left:9px}
.cv-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

/* Marketing */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brass)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px;display:grid;gap:8px;align-content:start}
.col h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;display:grid;gap:6px;font-size:13px}
.card small{color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.swatch{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12px}
.swatch i{display:block;height:64px}
.swatch div{padding:8px}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.asset{border:1px solid var(--line);border-radius:9px;padding:14px;display:grid;gap:6px;background:var(--surface)}
.asset .thumb{height:90px;border-radius:6px;background:var(--field);display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px}

/* Holding */
.org{display:grid;justify-items:center;gap:0;padding:10px 0}
.org-node{border:1px solid var(--line);border-top:3px solid var(--co);background:var(--surface);border-radius:6px;padding:12px 18px;text-align:center;min-width:200px}
.org-node small{display:block;color:var(--muted);font-size:11.5px}
.org-line{width:1px;height:24px;background:var(--line)}
.org-row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--line);padding-top:24px;position:relative}
.org-branch{display:grid;justify-items:center}

.logo{height:44px;width:auto;display:block}
#side .logo{height:40px}
.topbar .logo{height:30px}
.hero h1,.pub-sec h2,.page-head h1,.cv-head h2{font-weight:800;letter-spacing:-.015em}
.page-head h1{font-size:clamp(24px,2.6vw,32px)}
.cv-head h2{font-size:26px}
.hero{background:linear-gradient(180deg,var(--surface) 0%,var(--surface) 70%,var(--brass-soft) 100%)}

/* Zeitachse */
.story{display:grid;gap:18px}
.story-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.story-head h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.story-stats{display:flex;gap:22px;flex-wrap:wrap}
.story-stats div{display:grid}
.story-stats b{font-size:22px;font-weight:800;color:var(--brass);line-height:1.1}
.story-stats span{font-size:11.5px;color:var(--muted)}
.tl-scroll{overflow-x:auto;padding:6px 4px 14px;margin:0 -4px}
.tl{display:grid;grid-template-rows:auto 76px auto;column-gap:14px;min-width:min-content}
.tl-line{grid-row:2;grid-column:1/-1;align-self:center;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--ink) 4%,var(--ink) 96%,transparent)}
.tl-node{grid-row:2;display:grid;place-items:center;z-index:1}
.tl-dot{width:46px;height:46px;border-radius:50%;background:var(--co);display:grid;place-items:center;box-shadow:0 0 0 5px var(--surface),0 0 0 7px var(--co),0 6px 14px rgba(0,0,0,.18)}
.tl-dot svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tl-cell{display:flex;flex-direction:column;align-items:center}
.tl-cell.top{grid-row:1;justify-content:flex-end}
.tl-cell.bot{grid-row:3;justify-content:flex-start}
.tl-stem{width:0;height:24px;border-left:2px dotted var(--co);flex:none}
.tl-cell.top .tl-stem{order:2}
.tl-card{width:100%;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--co);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px 16px;display:grid;gap:8px;transition:transform .15s,box-shadow .15s}
.tl-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(17,21,19,.06),0 12px 28px rgba(17,21,19,.1)}
.tl-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.tl-brand{display:flex;align-items:center;gap:9px;min-width:0}
.tl-logo{height:38px;max-width:150px;object-fit:contain;display:block}
.tl-photo{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block}
.tl-badge{width:42px;height:42px;border-radius:11px;background:var(--co);color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;display:grid;place-items:center;flex:none}
.tl-badge.person{border-radius:50%}
.tl-badge-name{font-size:12px;font-weight:700;line-height:1.2;color:var(--ink)}
.tl-no{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.tl-year{font-size:28px;font-weight:800;line-height:1;color:var(--co);letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tl-year small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.tl-title{font-size:14.5px;line-height:1.3;font-weight:700}
.tl-card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.tl-foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--field);color:var(--co)}
.tl-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.tl-form .full{grid-column:1/-1}
.logo-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.logo-slot{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;justify-items:start;background:var(--surface-2)}
.logo-slot .prev{height:46px;display:flex;align-items:center}
.logo-slot small{color:var(--muted);font-size:11.5px}
.file-btn input{display:none}
/* Pflichtfelder hervorheben */
.field.is-req .inp{background:var(--brass-soft);box-shadow:inset 3px 0 0 var(--brass)}
.field.is-req label{color:var(--brass-ink)}
.field.is-req .inp:focus-within{background:var(--surface)}
.field.is-req.missing .inp{background:var(--bad-soft);box-shadow:inset 3px 0 0 var(--bad);border-color:var(--bad)}
.field.is-req.missing label{color:var(--bad)}

/* Layout-Umschalter Zeitachse */
.layout-pick{display:grid;gap:8px}
.layout-pick .seg{flex-wrap:wrap}
.layout-note{font-size:12.5px;color:var(--muted);max-width:70ch}
/* Variante 1: vertikal */
.tlv{position:relative;display:grid;gap:22px;padding:6px 0}
.tlv::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(180deg,transparent,var(--ink) 3%,var(--ink) 97%,transparent);border-radius:3px}
.tlv-item{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center}
.tlv-item .tl-card{max-width:420px}
.tlv-item.l .tl-card{grid-column:1;justify-self:end}
.tlv-item.r .tl-card{grid-column:3;justify-self:start}
.tlv-item .tl-node{grid-column:2;grid-row:1}
.tlv-item .tlv-arm{grid-row:1;height:0;border-top:2px dotted var(--co);align-self:center}
.tlv-item.l .tlv-arm{grid-column:1;justify-self:end;width:24px;margin-right:-24px;visibility:hidden}
@media (max-width:760px){
  .tlv::before{left:23px}
  .tlv-item{grid-template-columns:46px 1fr;gap:12px}
  .tlv-item .tl-node{grid-column:1}
  .tlv-item.l .tl-card,.tlv-item.r .tl-card{grid-column:2;grid-row:1;justify-self:stretch;max-width:none}
}
/* Variante 2: Jahreskapitel */
.ty{display:grid;gap:0}
.ty-row{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:22px 0;border-top:1px solid var(--line)}
.ty-row:first-child{border-top:0;padding-top:4px}
.ty-year{font-size:52px;font-weight:800;line-height:.9;color:var(--brass);letter-spacing:-.03em;position:sticky;top:12px;align-self:start}
.ty-year small{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.ty-list{display:grid;gap:12px}
.ty-item{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;padding:14px 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--co)}
.ty-item .tl-logo{height:32px;max-width:120px}
.ty-brand{min-width:56px;display:flex;align-items:center}
.ty-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--co);font-weight:500}
.ty-item .tl-title{margin-top:2px}
.ty-item p{margin:4px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:640px){.ty-row{grid-template-columns:1fr;gap:12px}.ty-year{position:static;font-size:40px}.ty-item{grid-template-columns:1fr}}
/* Variante 3: Swimlanes */
.ln-scroll{overflow-x:auto;padding-bottom:8px}
.ln{display:grid;grid-template-columns:190px 1fr;min-width:calc(190px + var(--yw) * var(--yn))}
.ln-head{display:contents}
.ln-years{display:grid;grid-template-columns:repeat(var(--yn),var(--yw));border-bottom:2px solid var(--ink)}
.ln-years span{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:6px 0 6px 6px;border-left:1px solid var(--line);color:var(--muted)}
.ln-years span.now{color:var(--brass)}
.ln-label{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);min-height:96px;position:sticky;left:0;background:var(--surface);z-index:2}
.ln-label .tl-logo{height:28px;max-width:130px}
.ln-label .tl-badge{width:34px;height:34px;font-size:12px}
.ln-label b{font-size:12.5px;line-height:1.25}
.ln-track{position:relative;border-bottom:1px solid var(--line);min-height:96px;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px var(--yw))}
.ln-bar{position:absolute;top:50%;height:12px;margin-top:-6px;border-radius:6px;background:var(--co);opacity:.22}
.ln-ev{position:absolute;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;z-index:1}
.ln-dot{width:22px;height:22px;border-radius:50%;background:var(--co);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--co);display:block;cursor:default;padding:0}
button.ln-dot{cursor:pointer}
.ln-lbl{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:700;background:var(--surface);padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.ln-lbl small{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-right:4px}
.ln-ev.up .ln-lbl{bottom:calc(100% + 6px)}
.ln-ev.dn .ln-lbl{top:calc(100% + 6px)}
.ln-today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--brass);z-index:0}
.ln-open{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:12.5px}

/* Zwei Stränge → gemeinsamer Weg */
.mg{display:grid;grid-template-rows:auto 190px auto;column-gap:14px;min-width:min-content}
.mg-band{grid-row:2;grid-column:1/-1;position:relative}
.mg-band svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mg-band path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.mg-dot{position:absolute;transform:translate(-50%,-50%);z-index:2}
.mg-dot .tl-dot{width:44px;height:44px}
.mg-dot.merge .tl-dot{width:58px;height:58px;box-shadow:0 0 0 6px var(--surface),0 0 0 9px var(--co),0 8px 20px rgba(0,0,0,.2)}
.mg-dot.merge .tl-dot svg{width:24px;height:24px}
.mg-stem{position:absolute;width:0;border-left:2px dotted var(--co);transform:translateX(-1px);z-index:1}
.mg-lbl{position:absolute;transform:translateY(-50%);font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--co);color:var(--co);white-space:nowrap;z-index:2}
.mg-lbl small{font-weight:500;color:var(--muted);margin-left:4px}
.mg-merge-lbl{position:absolute;transform:translate(-50%,0);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--ink);white-space:nowrap;z-index:2;background:var(--surface);padding:0 6px}
.mg .tl-cell .tl-stem{display:none}
.mg .tl-cell.top{padding-bottom:0}

/* Schlichte, kompakte Zeitachse */
.story{gap:14px}
.story-head h2{font-size:15px;font-weight:700;letter-spacing:0}
.story-stats{gap:18px}
.story-stats b{font-size:15px;font-weight:700;color:var(--ink)}
.story-stats span{font-size:11px}
.tl-card{border:1px solid var(--line);border-radius:8px;box-shadow:none;padding:10px 12px;gap:4px;background:var(--surface)}
.tl-card:hover{transform:none;box-shadow:none;border-color:var(--muted)}
.tl-card-head{min-height:0;gap:6px}
.tl-logo{height:20px;max-width:104px}
.tl-photo{width:24px;height:24px}
.tl-badge{width:22px;height:22px;font-size:9.5px;border-radius:5px}
.tl-badge-name{font-size:11.5px;font-weight:600;color:var(--muted)}
.tl-year{font-size:15px;font-weight:700;letter-spacing:0;gap:6px}
.tl-year small{font-size:11px}
.tl-title{font-size:12.5px;font-weight:600;line-height:1.35}
.tl-card p{font-size:11.5px;line-height:1.45}
.tl-foot .pill{font-size:10.5px;padding:1px 7px}
.tl-tag{font-size:10.5px;padding:1px 7px;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.tl-edit{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 6px;border-radius:5px;font-size:13px;line-height:1;flex:none}
.tl-edit:hover{background:var(--field);color:var(--ink)}
.mg{grid-template-rows:auto 92px auto;column-gap:10px}
.mg-dot .tl-dot{width:11px;height:11px;box-shadow:0 0 0 3px var(--surface)}
.mg-dot .tl-dot svg{display:none}
.mg-dot.merge .tl-dot{width:15px;height:15px;background:var(--surface);box-shadow:0 0 0 2.5px var(--ink),0 0 0 6px var(--surface)}
.mg-stem{border-left:1px solid var(--line)}
.mg-lbl{font-size:11px;font-weight:600;padding:0 6px;border:0;background:var(--surface);color:var(--co);border-radius:3px}
.mg-lbl small{font-weight:400}
.mg-merge-lbl{font-size:9.5px;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.tl-modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow)}
.tl-modal .tl-form{border-top:0;padding-top:0}
.lay-sel{background:var(--field);border:1px solid transparent;border-radius:7px;padding:6px 10px;font-size:12.5px}

/* Zwei Stränge mit Jahres-Swimlanes */
.mg2{display:grid;grid-template-rows:auto auto 92px auto;min-width:min-content;padding-bottom:6px}
.mg-stripe{grid-row:1/-1;border-left:1px solid var(--line);z-index:0}
.mg-stripe.alt{background:var(--surface-2)}
.mg-stripe:last-of-type{border-right:1px solid var(--line)}
.mg-year{grid-row:1;z-index:1;padding:7px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:10px;display:grid}
.mg-year b{font-family:var(--f-mono);font-size:13px;font-weight:600}
.mg-year small{font-size:10.5px;color:var(--muted);line-height:1.3}
.mg-year.empty b{color:var(--muted);font-weight:500}
.mg-year.now b{color:var(--brass)}
.mg2 .tl-cell{z-index:1;padding:0 8px}
.mg2 .tl-cell .tl-stem{display:none}
.mg-cell{grid-row:3;position:relative;z-index:1}
.mg-cell svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mg-cell path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.mg-gap{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap;z-index:3}
.mg-gap.today{color:var(--brass-ink);border-color:var(--brass)}

/* Kontoentwicklung */
.k-tbl th,.k-tbl td{white-space:nowrap}
.k-tbl td.r,.k-tbl th.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.k-tbl th.r{font-family:var(--f-body)}
.k-tbl .acc{background:var(--detail)}
.k-tbl th.acc{color:var(--brass-ink)}
.k-tbl .tot{font-weight:600}
.k-tbl .yr td{background:var(--surface-2);font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--muted);padding-block:5px}
.k-tbl .empty td{color:var(--muted)}
.k-tbl td.note{white-space:normal;min-width:260px;max-width:420px;font-size:12.5px}
.k-tbl tr:hover td{background:var(--surface-2)}
.k-tbl tr:hover td.acc{background:var(--detail)}
.k-toggle{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;cursor:pointer;margin-left:6px;color:var(--brass-ink)}
.k-toggle:hover{border-color:var(--brass)}
.k-chart svg{width:100%;height:auto;display:block;min-width:560px}
.k-sum{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:12px 14px;background:var(--surface-2);border-radius:8px;font-size:13px}
.k-sum b{font-family:var(--f-mono);font-weight:600;text-align:right}

/* Firmennamen im Logo-Stil */
.wm{display:inline-grid;line-height:1.08;text-transform:uppercase;text-align:right;justify-items:end;vertical-align:middle}
.wm b{font-weight:800;font-size:13px;letter-spacing:.01em;color:var(--co)}
.wm span{font-weight:400;font-size:10.5px;letter-spacing:.16em;color:var(--ink)}
.k-tbl thead th{vertical-align:bottom}
.k-tbl th.co-h{border-bottom:2px solid var(--co);text-transform:none}
.k-head-row{display:flex;align-items:flex-end;justify-content:flex-end;gap:8px}

.k-head-col{display:grid;justify-items:end;gap:3px}
.k-tbl .k-toggle{border:0;background:none;padding:0;margin:0;font-size:10.5px;font-weight:500;color:var(--muted);cursor:pointer;letter-spacing:0;text-transform:none}
.k-tbl .k-toggle:hover{color:var(--c-immo);text-decoration:underline}
.k-tbl th.acc{font-weight:500;text-transform:none;letter-spacing:0;font-size:11px;vertical-align:bottom}
/* Kontoentwicklung Chart */
.k-box{position:relative}
.k-box .chart-wrap svg{min-width:600px;width:100%;height:auto;display:block}
.k-hit{cursor:crosshair}
.k-hit:hover+.k-hl,.k-hl.on{opacity:1}
.k-hl{opacity:0;pointer-events:none}
.k-tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px 12px;font-size:12px;min-width:220px;max-width:280px;display:grid;gap:4px}
.k-tip .h{font-weight:700;font-size:12.5px;margin-bottom:2px}
.k-tip .ln{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center}
.k-tip .ln b{font-family:var(--f-mono);font-weight:500;text-align:right}
.k-tip .ln em{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:11px;min-width:42px;text-align:right}
.k-tip .sum{border-top:1px solid var(--line);padding-top:5px;margin-top:2px;display:flex;justify-content:space-between;font-weight:700}
.k-tip .sum b{font-family:var(--f-mono)}
.k-tip .note{color:var(--warn);font-size:11.5px;border-top:1px solid var(--line);padding-top:5px}

/* Immobilienportfolio */
.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px;align-items:start}
.pf-card{display:grid;gap:16px}
.pf-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.pf-photo{width:72px;height:72px;border-radius:10px;background:var(--field);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted);font-size:11px;text-align:center}
.pf-photo img{width:100%;height:100%;object-fit:cover}
.pf-title{flex:1;min-width:0;display:grid;gap:3px}
.pf-title .wm{text-align:left;justify-items:start}
.pf-title .wm b{font-size:16px}
.pf-addr{font-size:12.5px;color:var(--muted);line-height:1.45}
.pf-vals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pf-vals div{display:grid;gap:2px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.pf-vals span{font-size:11px;color:var(--muted);font-weight:600}
.pf-vals b{font-family:var(--f-mono);font-weight:500;font-size:15px}
.pf-fin{display:grid;gap:6px}
.pf-fin .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.pf-bar{height:6px;border-radius:99px;background:var(--field);overflow:hidden}
.pf-bar i{display:block;height:100%;background:var(--c-immo)}
.pf-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pf-cols h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pf-cols table td{padding:6px 0;font-size:12.5px}
.pf-cols table td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pf-cols tr.em td{font-weight:700}
.pf-flag{font-size:11px;color:var(--warn)}
@media (max-width:560px){.pf-vals,.pf-cols{grid-template-columns:1fr}}

.k-del:hover{color:var(--bad);background:var(--bad-soft)}
.k-del svg{display:block}
/* ===== Runde 10 ===== */
main{max-width:none}
.co-brand{min-height:46px;display:flex;align-items:center}
.co-logo{display:block;max-width:230px;width:auto;object-fit:contain}
.wm.wm-lg{text-align:left;justify-items:start}
.wm.wm-lg b{font-size:19px}
.wm.wm-lg span{font-size:11.5px}
.co-empty{color:var(--muted);font-size:13px;margin:0}
/* Struktur */
.org-roots{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
button.org-node{cursor:pointer;font:inherit;color:inherit;position:relative}
button.org-node:hover{box-shadow:0 0 0 2px var(--co)}
.org-pen{position:absolute;top:4px;right:7px;font-size:11px;color:var(--muted)}
/* Unternehmensinformationen */
.ci-row{display:grid;grid-template-columns:minmax(180px,250px) minmax(0,1fr) auto;gap:12px 28px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.ci-row:first-child{border-top:0;padding-top:4px}
.ci-facts{display:flex;flex-wrap:wrap;gap:10px 36px}
.ci-facts div{display:grid;gap:1px}
.ci-facts span{font-size:11.5px;color:var(--muted)}
.ci-facts b{font-weight:600;font-size:14px}
.ci-empty{color:var(--muted);font-size:13px}
.ci-row .co-logo{height:30px}
.ci-row .wm.wm-lg b{font-size:16px}
@media (max-width:700px){.ci-row{grid-template-columns:1fr auto}.ci-facts,.ci-empty{grid-column:1/-1;grid-row:2}}
.kv-edit{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
/* Rente + Brutto-Netto */
.rente-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.rente-main{display:grid;gap:22px;min-width:0}
.bn{position:sticky;top:16px;display:grid;gap:14px}
.bn .fgrid{grid-template-columns:1fr 1fr}
.bn-out{display:grid;gap:10px}
.bn-out table th,.bn-out table td{padding:5px 0;font-size:12.5px}
.bn-out td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bn-net{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-radius:8px;background:var(--brass-soft)}
.bn-net span{font-weight:600;font-size:13px}
.bn-net b{font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--brass-ink)}
@media (max-width:1180px){.rente-layout{grid-template-columns:1fr}.bn{position:static}}
/* Vertrieb */
.emp-tbl tr.on td{background:var(--brass-soft)}
.fass-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.fass{border:1px solid var(--line);border-radius:9px;padding:12px;display:grid;gap:6px;background:var(--surface);cursor:pointer;align-content:start}
.fass:hover{border-color:var(--muted)}
.fass.on{border-color:var(--brass);background:var(--brass-soft)}
.fass-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fass b{font-size:13px;line-height:1.35}
.fass small{font-size:11.5px}
.fass .actions{gap:2px;margin-top:2px}
.vt-work{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.vt-work{grid-template-columns:1fr}}
.save-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.cv-ed-proj{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;grid-template-columns:1fr 1fr;background:var(--surface-2)}
.cv-ed-proj .full{grid-column:1/-1}
/* Vertriebsmaterial */
.mat-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mat-chips{display:flex;gap:6px;flex-wrap:wrap}
.mat-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.mat-chip:hover{border-color:var(--muted)}
.mat-chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mat-chip small{font-weight:500;opacity:.7;margin-left:5px}
.mat-drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:12.5px}
.mat-drop.over{border-color:var(--brass);background:var(--brass-soft);color:var(--brass-ink)}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mat{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;background:var(--surface);align-content:start}
.mat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mat-ext{width:42px;height:50px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:#fff;background:var(--ext)}
.mat b{font-size:13.5px;line-height:1.35}
.mat small{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.up-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}

.emp .tl-edit{align-self:flex-start}
.emp-meta small .pill{font-size:10.5px;padding:1px 8px}
/* Aufgaben-Board */
.bd-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bd-scroll{overflow-x:auto;padding-bottom:10px}
.bd{display:flex;gap:14px;align-items:flex-start;min-width:min-content}
.bd-col{width:290px;flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.bd-col.over{border-color:var(--brass);background:var(--brass-soft)}
.bd-col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bd-col-h b{font-size:13px}
.bd-count{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--field);border-radius:999px;padding:1px 8px}
.bd-list{display:grid;gap:8px;padding:10px;min-height:56px;align-content:start}
.bd-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--co);border-radius:8px;padding:10px 12px;display:grid;gap:7px;cursor:grab;text-align:left;font:inherit;color:inherit;width:100%}
.bd-card:hover{border-color:var(--muted);border-left-color:var(--co)}
.bd-card.dragging{opacity:.4}
.bd-card b{font-size:13px;font-weight:600;line-height:1.35}
.bd-card.done b{text-decoration:line-through;color:var(--muted)}
.bd-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bd-tag{font-size:10.5px;font-weight:700;color:var(--co);background:var(--field);border-radius:4px;padding:1px 6px}
.bd-prio{width:8px;height:8px;border-radius:50%;flex:none}
.bd-due{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--field);color:var(--muted)}
.bd-due.soon{background:var(--warn-soft);color:var(--warn)}
.bd-due.late{background:var(--bad-soft);color:var(--bad)}
.bd-cl{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.bd-cl.full{color:var(--good)}
.bd-av{display:flex;margin-left:auto;padding-left:6px}
.bd-av span{width:22px;height:22px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);margin-left:-6px}
.bd-add{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;text-align:left;padding:4px 12px 12px;cursor:pointer}
.bd-add:hover{color:var(--ink)}
.bd-quick{display:grid;gap:8px;padding:0 10px 12px}
.bd-ph{height:4px;border-radius:2px;background:var(--brass)}
.cl-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.cl-row input[type=checkbox]{accent-color:var(--brass);width:16px;height:16px}

.bd-set-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
.bd-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.bd-sw{display:flex;gap:4px;flex-wrap:wrap}
.bd-sw button{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.bd-sw button.on{box-shadow:0 0 0 2px var(--ink)}
@media (max-width:640px){.bd-set-row{grid-template-columns:auto 1fr auto}.bd-sw{grid-column:2/-1;grid-row:2}}
.bd-dot{overflow:hidden}
.bd-dot img{width:100%;height:100%;object-fit:cover}
.bd-dot.sq{border-radius:6px}
.bd-dot.sq img{object-fit:contain;padding:2px}
.bd-img-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bd-tag{display:inline-flex;align-items:center;gap:4px}
.bd-tag img{height:13px;max-width:40px;object-fit:contain}
.bd-av span{overflow:hidden}
.bd-av span img{width:100%;height:100%;object-fit:cover}
.bd-chip{display:inline-flex;align-items:center;gap:6px}
.bd-chip img{height:14px;max-width:44px;object-fit:contain;background:#fff;border-radius:3px}
.bd-chip.logo{padding:3px 10px;background:#fff}
.bd-chip.logo.on{background:#fff;box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.bd-chip.logo img{height:20px;max-width:90px;background:none}
.bd-tag.logo{background:#fff;border:1px solid var(--line);padding:1px 5px}
.bd-tag.logo img{height:16px;max-width:70px}
.bd-copick{display:flex;gap:8px;flex-wrap:wrap}
.bd-copick button{min-height:42px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;display:grid;place-items:center;border-left:4px solid var(--co,var(--line))}
.bd-copick button:hover{border-color:var(--muted)}
.bd-copick button.on{box-shadow:0 0 0 2px var(--brass);border-color:var(--brass)}
.bd-copick button img{max-width:110px;object-fit:contain}
/* Google Analytics */
.ga-bar-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ga-d{font-family:var(--f-mono);font-size:11.5px;font-weight:600}
.ga-d.up{color:var(--good)}.ga-d.down{color:var(--bad)}
.ga-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.ga-bars{display:grid;gap:10px}
.ga-bar{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.ga-bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ga-bt{height:10px;background:var(--field);border-radius:5px;overflow:hidden}
.ga-bt i{display:block;height:100%;background:var(--brass);border-radius:0 5px 5px 0}
.ga-bar b{font-weight:500;font-size:12.5px;min-width:44px;text-align:right}
.ga-stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin-top:12px}
.ga-stack i{display:block;height:100%}
@media (max-width:980px){
  .calc-grid,.vt-grid{grid-template-columns:1fr}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  #app.open #side{transform:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
  .topbar button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
  .fgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function compute(c){
  const v=k=>{const x=parseFloat(c[k]);return Number.isFinite(x)?x:0};
  const kp=v('kaufpreis'),fl=v('flaeche'),D=v('darlehen'),i=v('zins')/100,t=v('tilgung')/100,n=v('bindung');
  const nkPct=v('grest')+v('notar')+v('makler'), nkSum=kp*nkPct/100, makler=kp*v('makler')/100, invest=kp+nkSum;
  const afa=Math.max(0,invest-v('grund'))*v('afa')/100;
  const zinsen=D*i, tilg=D*t, rate=zinsen+tilg;
  const res=mJ=>{const gvst=mJ-zinsen-afa-v('nk');const st=Math.max(0,gvst*v('kst')/100);const ueb=mJ-v('nk')-st-rate;return{mJ,gvst,st,ueb,entl:gvst<0?-gvst*v('kst')/100:0}};
  const mieteIstM=v('mieteIst'), mieteSollM=v('mspSoll')*fl;
  const ist=res(mieteIstM*12), soll=res(mieteSollM*12);
  const q=1+i; const rest=i>0?Math.max(0,D*q**n-rate*(q**n-1)/i):Math.max(0,D-tilg*n);
  const voll=(i>0&&rate>D*i)?Math.log(rate/(rate-D*i))/Math.log(q):NaN;
  let ende='';if(c.start){const d=new Date(c.start);d.setFullYear(d.getFullYear()+n);ende=d.toISOString().slice(0,10)}
  return{kp,fl,D,nkSum,nkPct,makler,invest,afa,zinsen,tilg,rate,ist,soll,mieteIstM,mieteSollM,
    mspIst:fl?mieteIstM/fl:NaN,qm:fl?kp/fl:NaN,brutto:kp?ist.mJ/kp*100:NaN,bruttoSoll:kp?soll.mJ/kp*100:NaN,
    netto:invest?(ist.mJ-v('nk'))/invest*100:NaN,ek:invest-D,rest,voll,ende};
}

function tailor(cv,text){
  const low=text.toLowerCase();
  const found=KEYWORDS.filter(k=>new RegExp('(^|[^a-zäöü])'+k.toLowerCase().replace(/[/.]/g,'\\$&')+'([^a-zäöü]|$)','i').test(low));
  const has=new Set(cv.skills.concat(cv.projects.flatMap(p=>p.tags||[])));
  const hit=found.filter(k=>has.has(k)), gap=found.filter(k=>!has.has(k));
  const score=found.length?Math.round(hit.length/found.length*100):0;
  const top=hit.slice(0,3);
  const summary=cv.summary.map(s=>s.gen&&hit.length?{t:s.t,ch:'del'}:{t:s.t});
  if(hit.length)summary.push({t:`Für dieses Projekt bringe ich insbesondere fundierte Erfahrung in ${top.slice(0,-1).join(', ')}${top.length>1?' und ':''}${top[top.length-1]} mit.`,ch:'ins'});
  const sHit=cv.skills.filter(s=>hit.includes(s)), sRest=cv.skills.filter(s=>!hit.includes(s));
  const skills=sHit.map((s,idx)=>({t:s,hit:1,moved:cv.skills.indexOf(s)!==idx})).concat(sRest.map(s=>({t:s})));
  const scored=cv.projects.map((p,idx)=>({...p,idx,m:(p.tags||[]).filter(t=>hit.includes(t))}));
  const sorted=[...scored].sort((a,b)=>b.m.length-a.m.length||a.idx-b.idx);
  const projects=sorted.map((p,pos)=>({...p,moved:pos!==p.idx,bul:[...(p.bul||[]).map(b=>typeof b==='string'?{t:b}:b),...(p.m.length?[{t:'Relevante Schwerpunkte: '+p.m.join(', '),ch:'ins'}]:[])],short:p.m.length===0&&pos>0}));
  return{found,hit,gap,score,role:cv.role+(top.length?' | '+top.join(' · '):''),summary,skills,projects};
}
function tailoredCV(r,b){
  return{role:r.role,loc:b.loc,summary:r.summary.filter(s=>s.ch!=='del').map(s=>({t:s.t})),skills:r.skills.map(s=>s.t),
    projects:r.projects.map(p=>({title:p.title,client:p.client,period:p.period,text:p.short?p.text.split('.')[0]+'.':p.text,tags:[...(p.tags||[])],bul:(p.bul||[]).map(x=>typeof x==='string'?x:x.t)})),certs:[...b.certs]};
}

    h+='</div>';

/* Brutto-Netto-Rechner (Näherung Lohnsteuer 2026, Steuerklassen I–IV) */
let bn=store.get('ch_bn_v1',null)||{brutto:9166,zeit:'monat',stkl:'1',kinder:0,kirche:false,kist:9,sv:true,zusatz:2.9,pkv:0};
const saveBn=()=>store.set('ch_bn_v1',bn);
function est26(x){x=Math.floor(Math.max(0,x));if(x<=12348)return 0;if(x<=17799){const y=(x-12348)/1e4;return Math.floor((914.51*y+1400)*y)}if(x<=69878){const z=(x-17799)/1e4;return Math.floor((173.10*z+2397)*z+1034.87)}if(x<=277825)return Math.floor(0.42*x-11135.63);return Math.floor(0.45*x-19470.38)}
function bnCalc(b){
  const J=Math.max(0,(+b.brutto||0)*(b.zeit==='jahr'?1:12)),BBG_KV=69750,BBG_RV=101400,k=+b.kinder||0;
  let rv=0,av=0,kv=0,pv=0,pkv=0,vors=0;
  if(b.sv){const za=(+b.zusatz||0)/100;rv=Math.min(J,BBG_RV)*0.093;av=Math.min(J,BBG_RV)*0.013;kv=Math.min(J,BBG_KV)*(0.073+za/2);
    const pvR=k===0?0.024:k===1?0.018:0.018-0.0025*Math.min(k-1,4);pv=Math.min(J,BBG_KV)*pvR;
    vors=rv+Math.min(J,BBG_KV)*(0.07+za/2)+pv;}
  else{pkv=(+b.pkv||0)*12;vors=pkv}
  const zve=Math.max(0,J-1230-36-vors-(b.stkl==='2'?4260:0));
  const split=b.stkl==='3',lst=split?2*est26(zve/2):est26(zve),fg=split?40700:20350;
  const soli=lst<=fg?0:Math.min(0.055*lst,0.119*(lst-fg)),kist=b.kirche?lst*(+b.kist||9)/100:0;
  const net=J-lst-soli-kist-rv-av-kv-pv-pkv;
  return{J,lst,soli,kist,rv,av,kv,pv,pkv,net,quote:J?net/J*100:0};
}

    <div class="field"><label for="bn_s">Steuerklasse</label><div class="inp"><select id="bn_s" data-b="stkl">${['1','2','3','4'].map(s=>`<option value="${s}" ${bn.stkl===s?'selected':''}>${['I','II','III','IV'][+s-1]}</option>`).join('')}</select></div></div>

    ${bn.sv?`<div class="field"><label for="bn_zb">KV-Zusatzbeitrag</label><div class="inp"><input type="number" id="bn_zb" data-b="zusatz" step="0.1" value="${bn.zusatz}"><span class="u">%</span></div></div>`

function renteChart(r){
  const W=760,H=300,L=64,R=16,T=20,B=40,pw=W-L-R,ph=H-T-B;
  const max=Math.max(rente.ziel,...r.years.map(y=>y.tot))*1.12;
  const step=max>600000?200000:max>250000?100000:50000;
  const sy=v=>T+ph-v/max*ph, bw=pw/r.years.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Passives Einkommen pro Jahr">`;
  for(let v=0;v<=max;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${L-8}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${num(v/1000)}k</text>`;
  r.years.forEach((y,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;
    s+=`<rect x="${x}" y="${sy(y.obj)}" width="${w}" height="${Math.max(0,sy(0)-sy(y.obj))}" fill="var(--c-immo)" rx="2"/>`;
    if(y.vk)s+=`<rect x="${x}" y="${sy(y.tot)}" width="${w}" height="${sy(y.obj)-sy(y.tot)}" fill="var(--c-tc)" rx="2"/>`;
    s+=`<text x="${x+w/2}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="${r.first&&r.first.y===y.y?'var(--good)':'var(--muted)'}" font-weight="${r.first&&r.first.y===y.y?700:400}" font-family="IBM Plex Mono,monospace">${y.y}</text>`;
    if(y.tot>0)s+=`<text x="${x+w/2}" y="${sy(y.tot)-5}" text-anchor="middle" font-size="9.5" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${num(y.tot/1000)}k</text>`;});
  s+=`<line x1="${L}" x2="${W-R}" y1="${sy(rente.ziel)}" y2="${sy(rente.ziel)}" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${sy(rente.ziel)-6}" text-anchor="end" font-size="11" fill="var(--ink)" font-weight="600">Ziel ${num(rente.ziel/1000)}k</text>`;
  return s+'</svg>';
}

/* Word-Export (docx) über den downloads-Capability */
let dlNS;
async function getDL(){if(dlNS!==undefined)return dlNS;try{dlNS=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dlNS=null}return dlNS}
function cvDocx(emp,cv){
  const X=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const run=(t,o={})=>`<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}${o.c?`<w:color w:val="${o.c}"/>`:''}<w:sz w:val="${o.sz||21}"/></w:rPr><w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
  const p=(runs,o={})=>`<w:p><w:pPr><w:spacing w:before="${o.before||0}" w:after="${o.after==null?80:o.after}"/>${o.ind?'<w:ind w:left="340" w:hanging="200"/>':''}${o.line?'<w:pBdr><w:bottom w:val="single" w:sz="12" w:space="6" w:color="2B5C9E"/></w:pBdr>':''}</w:pPr>${runs}</w:p>`;
  const h=t=>p(run(t.toUpperCase(),{b:1,c:'2B5C9E',sz:19}),{before:260,after:80});
  const st=emp.status||{},avail=st.s==='bench'||!st.s?'sofort':availTxt(st)==='–'?'nach Absprache':'ab '+availTxt(st);
  let b=p(run(emp.n,{b:1,sz:40}),{after:40})+p(run(cv.role||'',{c:'2B5C9E',sz:24,b:1}),{after:60})
    +p(run(['TestConsulting CC GmbH',cv.loc,'Verfügbar '+avail].filter(Boolean).join('  ·  '),{c:'59625C',sz:18}),{line:1,after:120});
  if(cv.summary.length)b+=h('Profil')+p(run(cv.summary.map(s=>s.t).join(' ')));
  if(cv.skills.length)b+=h('Kompetenzen')+p(run(cv.skills.join('  ·  ')));
  if(cv.projects.length){b+=h('Projekterfahrung');cv.projects.forEach(pr=>{
    b+=p(run(pr.title||'',{b:1})+(pr.period?run('   '+pr.period,{c:'59625C',sz:19}):''),{before:140,after:20});
    if(pr.client)b+=p(run(pr.client,{i:1,c:'59625C',sz:19}),{after:40});
    if(pr.text)b+=p(run(pr.text),{after:40});
    (pr.bul||[]).forEach(x=>{b+=p(run('•  '+(typeof x==='string'?x:x.t)),{ind:1,after:20})});});}
  if(cv.certs.length)b+=h('Zertifizierungen')+p(run(cv.certs.join('  ·  ')));
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const z=new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/document.xml',doc);
  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
async function downloadCV(btn,emp,cv,label){
  const fname=('CV '+emp.n+' - '+label).replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,120)+'.docx';
  if(btn)btn.disabled=true;
  try{
    if(typeof JSZip==='undefined'){toast('Word-Export konnte nicht geladen werden');return}
    const dl=await getDL();if(!dl){toast('Download ist in dieser Ansicht nicht verfügbar');return}
    await dl.save({filename:fname,data:await cvDocx(emp,cv)});toast('CV gespeichert');
  }catch(e){const c=e&&e.code;toast(c==='declined'?'Download abgebrochen':c==='rate_limited'?'Bitte kurz warten und erneut versuchen':'Download nicht möglich'+(c?' ('+c+')':''))}
  finally{if(btn)btn.disabled=false}
}
function cvHTML(emp,cv,r){

  const marks=r&&vt.marks;
  const role=r?(marks&&r.role!==cv.role?`<del>${esc(cv.role)}</del> <ins>${esc(r.role)}</ins>`:esc(r.role)):esc(cv.role);
  const st=emp.status||{};
  return `<article class="cv ${marks?'':'clean'}">
   <div class="cv-head"><div><h2>${esc(emp.n)}</h2><div class="role">${role||'<span class="muted">Rolle ergänzen</span>'}</div></div>
     <div class="muted" style="font-size:12px;text-align:right">TestConsulting CC GmbH<br>${esc(cv.loc||'')}<br>Verfügbar ${st.s==='bench'||!st.s?'sofort':availTxt(st)==='–'?'nach Absprache':'ab '+availTxt(st)}</div></div>
   ${summary.length?`<div><h4>Profil</h4><p>${summary.map(s=>mark(s.t,s.ch)).join(' ')}</p></div>`:''}
   ${skills.length?`<div><h4>Kompetenzen</h4><div class="chips">${skills.map(s=>`<span class="chip ${s.hit&&marks?'hit':''} ${s.moved?'moved':''}">${esc(s.t)}</span>`).join('')}</div></div>`:''}
   ${projects.length?`<div><h4>Projekterfahrung</h4><div style="display:grid;gap:12px">${projects.map(p=>{const bul=(p.bul||[]).map(b=>typeof b==='string'?{t:b}:b);return `<div class="cv-proj ${p.moved?'moved':''}"><div class="top"><b>${esc(p.title)}</b><span class="mono muted" style="font-size:12px">${esc(p.period||'')}</span></div><span class="muted" style="font-size:12.5px">${esc(p.client||'')}</span>
     <p>${p.short?`${esc(p.text.split('.')[0])}.<del>${esc(p.text.split('.').slice(1).join('.'))}</del>`:esc(p.text||'')}</p>${bul.length?`<ul>${bul.map(b=>`<li>${mark(b.t,b.ch)}</li>`).join('')}</ul>`:''}</div>`}).join('')}</div></div>`:''}
   ${cv.certs.length?`<div><h4>Zertifizierungen</h4><p>${cv.certs.map(esc).join(' · ')}</p></div>`:''}
   ${!summary.length&&!skills.length&&!projects.length?'<p class="muted">Diese Fassung ist noch leer. Über ✎ Bearbeiten Profil, Kompetenzen und Projekte ergänzen.</p>':''}
  </article>`;
}

function kStack(d){
  if(d.length<2)return '<p class="muted">Mindestens zwei Stichtage nötig.</p>';
  const W=760,H=270,L=64,R=18,T=16,B=34,pw=W-L-R,ph=H-T-B,n=d.length;
  const max=Math.ceil(Math.max(...d.map(r=>r.tot))*1.08/100000)*100000,step=max>400000?100000:50000;
  const x=i=>L+i*pw/(n-1),y=v=>T+ph-v/max*ph;
  const tc=d.map(r=>fin(r.tc)?r.tc:0),ac=d.map(r=>r.acS||0);
  const area=(lo,hi)=>'M'+hi.map((v,i)=>`${x(i)},${y(v)}`).join(' L')+' L'+lo.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' L')+'Z';
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kontostand je Gesellschaft">`;
  for(let v=0;v<=max;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${num(v/1000)}k</text>`;
  s+=`<path d="${area(d.map(()=>0),tc)}" fill="var(--c-tc)" fill-opacity=".85"/><path d="${area(tc,tc.map((v,i)=>v+ac[i]))}" fill="var(--c-immo)" fill-opacity=".85"/>`;
  s+=`<polyline points="${d.map((r,i)=>`${x(i)},${y(r.tot)}`).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  d.forEach((r,i)=>{s+=`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${mLabel(r.d)}</text>`;
    if(r.note)s+=`<circle cx="${x(i)}" cy="${y(r.tot)}" r="5" fill="var(--warn)" stroke="var(--surface)" stroke-width="2"><title>${deDate(r.d)}: ${esc(r.note)}</title></circle>`});
  const l=d[n-1];s+=`<circle cx="${x(n-1)}" cy="${y(l.tot)}" r="4" fill="var(--ink)"/><text x="${x(n-1)-6}" y="${y(l.tot)-10}" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${eur(l.tot,0)}</text>`;
  return s+'</svg>';
}
function kBars(d){
  if(!d.length)return '<p class="muted">Noch keine Veränderungen.</p>';
  const W=760,H=200,L=64,R=18,T=18,B=30,pw=W-L-R,ph=H-T-B,n=d.length;
  const mx=Math.max(...d.map(r=>r.chg),0),mn=Math.min(...d.map(r=>r.chg),0),rng=(mx-mn)||1,y=v=>T+(mx-v)/rng*ph,bw=pw/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Veränderung zum Vormonat">`;
  const st=50000;for(let v=Math.ceil(mn/st)*st;v<=mx;v+=st)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${num(v/1000)}k</text>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink)"/>`;
  d.forEach((r,i)=>{const x0=L+i*bw+bw*.22,w=bw*.56,yy=y(Math.max(r.chg,0)),hh=Math.abs(y(r.chg)-y(0));
    s+=`<rect x="${x0}" y="${yy}" width="${w}" height="${Math.max(hh,1)}" rx="2" fill="${r.chg<0?'var(--bad)':'var(--good)'}"><title>${deDate(r.d)}: ${eur(r.chg)}${r.note?' – '+esc(r.note):''}</title></rect>`;
    s+=`<text x="${x0+w/2}" y="${r.chg<0?y(r.chg)+12:yy-4}" text-anchor="middle" font-size="9.5" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${(r.chg>=0?'+':'')+num(r.chg/1000,1)}k</text>`;
    s+=`<text x="${x0+w/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${mLabel(r.d)}</text>`});
  return s+'</svg>';
}

let kMode=store.get('ch_konto_mode','abs');
const K_SEGS=[['tc','TestConsulting CC GmbH','var(--c-tc)',r=>fin(r.tc)?r.tc:0],['ac','AC Immo Invest GmbH','var(--c-immo)',r=>r.acS||0],['ho','Ceremesiz Holding','var(--c-holding)',r=>fin(r.ho)?r.ho:0]];
function kChart(d){
  if(!d.length)return '<p class="muted">Noch keine Stichtage erfasst.</p>';
  const P=kMode==='pct',W=780,H=290,L=58,R=150,T=26,B=30,pw=W-L-R,ph=H-T-B,n=d.length,bw=pw/n,w=Math.min(44,bw*.6);
  const max=P?100:Math.ceil(Math.max(...d.map(r=>r.tot))*1.1/100000)*100000,step=P?25:(max>400000?100000:50000);
  const y=v=>T+ph-v/max*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kontostände je Gesellschaft pro Stichtag, gestapelt">`;
  for(let v=0;v<=max+1e-9;v+=step)s+=`<line x1="${L}" x2="${L+pw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0?'':'stroke-dasharray="2 4"'}/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${P?v+' %':num(v/1000)+'k'}</text>`;
  d.forEach((r,i)=>{const cx=L+i*bw+bw/2,x0=cx-w/2;let cum=0;const segs=K_SEGS.map(g=>[g,g[3](r)]).filter(x=>x[1]>0);
    segs.forEach(([g,v],k)=>{const val=P?v/r.tot*100:v,yt=y(cum+val),yb=y(cum),top=k===segs.length-1,h=Math.max(0,yb-yt-(k>0?2:0));
      if(top){const rr=Math.min(4,h);s+=`<path d="M${x0} ${yt+h} V${yt+rr} Q${x0} ${yt} ${x0+rr} ${yt} H${x0+w-rr} Q${x0+w} ${yt} ${x0+w} ${yt+rr} V${yt+h} Z" fill="${g[2]}"/>`}
      else s+=`<rect x="${x0}" y="${yt}" width="${w}" height="${h}" fill="${g[2]}"/>`;cum+=val});
    const topY=y(P?100:r.tot);
    if(!P)s+=`<text x="${cx}" y="${topY-6}" text-anchor="middle" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${num(r.tot/1000)}k</text>`;
    if(r.note)s+=`<circle cx="${cx}" cy="${P?topY-8:topY-20}" r="4" fill="var(--warn)" stroke="var(--surface)" stroke-width="2"/>`;
    s+=`<text x="${cx}" y="${H-B+18}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${mLabel(r.d)}</text>`;
    s+=`<rect class="k-hit" data-ki="${i}" x="${L+i*bw}" y="${T-14}" width="${bw}" height="${ph+14}" fill="transparent"/><rect class="k-hl" x="${x0-3}" y="${T-14}" width="${w+6}" height="${ph+14}" fill="none" stroke="var(--muted)" stroke-dasharray="2 3" rx="4"/>`;});
  // Direktbeschriftung am letzten Balken
  const l=d[n-1],lx=L+(n-1)*bw+bw/2+w/2+10;let cum=0;const labs=[];
  K_SEGS.forEach(g=>{const v=g[3](l);if(v<=0)return;const val=P?v/l.tot*100:v;labs.push({y:y(cum+val/2),t:g[1].split(' ')[0]==='Ceremesiz'?'Holding':g[1].replace(' CC GmbH','').replace(' Invest GmbH',''),v:P?pct(val,1):num(v/1000)+'k',c:g[2]});cum+=val});
  for(let k=1;k<labs.length;k++)if(labs[k-1].y-labs[k].y<14)labs[k].y=labs[k-1].y-14;
  labs.forEach(a=>s+=`<circle cx="${lx+3}" cy="${a.y-4}" r="3.5" fill="${a.c}"/><text x="${lx+11}" y="${a.y}" font-size="11" fill="var(--ink)">${a.t} <tspan fill="var(--muted)" font-family="IBM Plex Mono,monospace">${a.v}</tspan></text>`);
  return s+'</svg>';
}
function bindKChart(d){
  const box=$('#kBox'),tip=$('#kTip');if(!box||!tip)return;
  $$('#kBox [data-ki]').forEach(el=>{
    el.addEventListener('mousemove',ev=>{const r=d[+el.dataset.ki],b=box.getBoundingClientRect();
      tip.innerHTML=`<div class="h">Stichtag ${deDate(r.d)}</div>${K_SEGS.map(g=>{const v=g[3](r);return v>0?`<div class="ln"><i class="sw" style="background:${g[2]}"></i><span>${g[1]}</span><b>${eur(v,0)}</b><em>${pct(v/r.tot*100,1)}</em></div>`:''}).join('')}
        <div class="sum"><span>Gesamt</span><b>${eur(r.tot,0)}</b></div>${r.chg!=null?`<div class="ln" style="grid-template-columns:1fr auto"><span class="muted">Veränderung zum Vormonat</span><b class="${r.chg<0?'neg':'pos'}">${(r.chg>=0?'+ ':'')+eur(r.chg,0)}</b></div>`:''}${r.note?`<div class="note">● Sonderausgabe: ${esc(r.note)}</div>`:''}`;
      tip.hidden=false;let x=ev.clientX-b.left+14,yy=ev.clientY-b.top+14;if(x+290>b.width)x=ev.clientX-b.left-tip.offsetWidth-14;tip.style.left=Math.max(0,x)+'px';tip.style.top=yy+'px';});
    el.addEventListener('mouseleave',()=>tip.hidden=true);
    el.addEventListener('click',ev=>{el.dispatchEvent(new MouseEvent('mousemove',{clientX:ev.clientX,clientY:ev.clientY}))});
  });
}

  const line=a=>a.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nutzer pro Tag, aktueller Zeitraum und Vorperiode">`;
  for(let v=0;v<=max;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v?'stroke-dasharray="2 4"':''}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  const every=Math.ceil(n/8);D.cur.forEach((p,i)=>{if(i%every===0||i===n-1)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${p.d.slice(8,10)}.${p.d.slice(5,7)}.</text>`});
  s+=`<path d="${line(D.cur)} L${x(n-1)},${y(0)} L${x(0)},${y(0)}Z" fill="var(--brass)" fill-opacity=".08"/>`;
  s+=`<path d="${line(D.prev)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><path d="${line(D.cur)}" fill="none" stroke="var(--brass)" stroke-width="2"/>`;
  const l=D.cur[n-1];s+=`<circle cx="${x(n-1)}" cy="${y(l.v)}" r="4" fill="var(--brass)" stroke="var(--surface)" stroke-width="2"/>`;
  s+=`<line id="gaX" x1="0" x2="0" y1="${T}" y2="${T+ph}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><rect id="gaHit" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/>`;
  return s+'</svg>';
}
function gaBars(rows,fmt){const m=Math.max(...rows.map(r=>r.v),1);return `<div class="ga-bars">${rows.map(r=>`<div class="ga-bar"><span class="ga-bl">${esc(r.n)}</span><span class="ga-bt"><i style="width:${r.v/m*100}%"></i></span><b class="num">${fmt(r.v)}</b></div>`).join('')}</div>`}
function renderGA(){
  const p=ga.props.find(x=>x.id===ga.sel)||ga.props[0];if(!p){$('#mkBody').innerHTML='<section class="panel"><p class="muted">Keine Website hinterlegt.</p></section>';return}
  const D=gaData(p,ga.range),K=D.kpi,devN=['Mobil','Desktop','Tablet'],devC=['var(--brass)','var(--c-tc)','var(--c-immo)'];
  const kpi=(l,v,d,s)=>`<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span><span class="s">${d} ${s||''}</span></div>`;
  const mmss=sec=>`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} Min.`;
  $('#mkBody').innerHTML=`
  <div class="ga-bar-top">
    <div class="actions" style="align-items:center">
      <div class="inp"><select id="gaProp" aria-label="Website wählen">${ga.props.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.site)}</option>`).join('')}</select></div>
      <div class="seg" role="tablist" aria-label="Zeitraum">${[[7,'7 Tage'],[28,'28 Tage'],[90,'90 Tage']].map(([d,l])=>`<button data-gr="${d}" class="${ga.range===d?'on':''}">${l}</button>`).join('')}</div>
    </div>
    <div class="actions" style="align-items:center">${p.mid?`<span class="pill neutral">${esc(p.mid)}</span>`:'<span class="pill warn">Mess-ID fehlt</span>'}<span class="pill brass">Beispieldaten</span><button class="btn sm" id="gaSet">Verbindung &amp; Websites</button></div>
  </div>
  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
    ${kpi('Nutzer',num(K.users.cur),gaDelta(K.users.cur,K.users.prev),'vs. Vorperiode')}
    ${kpi('Sitzungen',num(K.sess.cur),gaDelta(K.sess.cur,K.sess.prev))}
    ${kpi('Seitenaufrufe',num(K.views.cur),gaDelta(K.views.cur,K.views.prev))}
    ${kpi('Engagement-Rate',pct(K.eng.cur*100,1),gaDelta(K.eng.cur,K.eng.prev,1))}
    ${kpi('Ø Engagement-Zeit',mmss(K.dur.cur),gaDelta(K.dur.cur,K.dur.prev))}
    ${kpi('Kontaktanfragen',num(K.conv.cur),gaDelta(K.conv.cur,K.conv.prev),'Conversion „generate_lead“')}
  </div>
  <section class="panel"><div class="panel-h"><h2>Nutzer pro Tag · ${esc(p.site)}</h2><div class="legend"><span><i class="sw" style="background:var(--brass)"></i>Letzte ${ga.range} Tage</span><span><i class="sw" style="background:none;border-top:2px dashed var(--muted);height:0;border-radius:0"></i>Vorperiode</span></div></div>
    <div class="k-box" id="gaBox"><div class="chart-wrap k-chart">${gaChart(D)}</div><div class="k-tip" id="gaTip" hidden></div></div></section>
  <div class="ga-grid">
    <section class="panel"><h2>Top-Seiten</h2><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Seite</th><th class="r">Aufrufe</th><th class="r">Ø Zeit</th></tr></thead><tbody>
      ${D.pages.map(x=>`<tr><td><b>${esc(x.t)}</b><br><small class="muted mono">${esc(x.pa)}</small></td><td class="r num">${num(x.v)}</td><td class="r num">${mmss(x.s)}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="panel"><h2>Kanäle</h2><p class="muted" style="font-size:12px;margin:4px 0 12px">Sitzungen nach Herkunft</p>${gaBars(D.channels,v=>num(v))}</section>
    <section class="panel"><h2>Geräte</h2><div class="ga-stack" role="img" aria-label="Geräteverteilung">${D.dev.map((v,i)=>`<i style="width:${v*100}%;background:${devC[i]}"></i>`).join('')}</div>
      <div style="display:grid;gap:8px;margin-top:12px">${D.dev.map((v,i)=>`<div style="display:flex;justify-content:space-between;font-size:13px"><span><i class="sw" style="background:${devC[i]};display:inline-block;margin-right:6px"></i>${devN[i]}</span><b class="num">${pct(v*100,1)}</b></div>`).join('')}</div>
      <h2 style="margin-top:20px">Städte</h2><div style="margin-top:12px">${gaBars(D.cities,v=>num(v))}</div></section>
  </div>
  <p class="muted" style="font-size:12px;margin:0">Prototyp: Alle Zahlen sind erfundene Beispieldaten. In der echten Anwendung liest das Backend die Werte über die Google Analytics Data API (GA4) aus der hinterlegten Property.</p>
  <div id="gaFormWrap"></div>`;
  $('#gaProp').onchange=e=>{ga.sel=e.target.value;saveGa();renderGA()};
  $$('[data-gr]').forEach(b=>b.onclick=()=>{ga.range=+b.dataset.gr;saveGa();renderGA()});
  $('#gaSet').onclick=()=>{gaForm={props:JSON.parse(JSON.stringify(ga.props))};renderGaForm()};
  const hit=$('#gaHit'),tip=$('#gaTip'),box=$('#gaBox'),xl=$('#gaX');
  if(hit){const svg=hit.ownerSVGElement;
    const show=ev=>{const pt=svg.createSVGPoint?svg.createSVGPoint():null;let sx;if(pt&&svg.getScreenCTM()){pt.x=ev.clientX;pt.y=ev.clientY;sx=pt.matrixTransform(svg.getScreenCTM().inverse()).x}else return;
      const n=D.cur.length,i=Math.max(0,Math.min(n-1,Math.round((sx-44)/(704)*(n-1)))),c=D.cur[i],pv=D.prev[i],X=44+(n<2?352:i*704/(n-1));
      xl.setAttribute('x1',X);xl.setAttribute('x2',X);xl.setAttribute('visibility','visible');
      tip.innerHTML=`<div class="h">${deDate(c.d)}</div><div class="ln"><i class="sw" style="background:var(--brass)"></i><span>Nutzer</span><b>${num(c.v)}</b><em></em></div><div class="ln"><i class="sw" style="background:var(--muted)"></i><span>Vorperiode (${deDate(pv.d)})</span><b>${num(pv.v)}</b><em></em></div>`;
      tip.hidden=false;const b=box.getBoundingClientRect();let lx=ev.clientX-b.left+14;if(lx+240>b.width)lx=ev.clientX-b.left-tip.offsetWidth-14;tip.style.left=Math.max(0,lx)+'px';tip.style.top=(ev.clientY-b.top+10)+'px'};
    hit.addEventListener('mousemove',show);hit.addEventListener('click',show);hit.addEventListener('mouseleave',()=>{tip.hidden=true;xl.setAttribute('visibility','hidden')})}
}
function renderGaForm(){
  const w=$('#gaFormWrap');if(!w)return;const f=gaForm;if(!f){w.innerHTML='';return}
  w.innerHTML=`<div class="overlay" id="gaOv"><div class="panel tl-modal" style="width:min(640px,100%)" role="dialog" aria-modal="true" aria-labelledby="gaT">
   <div class="panel-h"><h2 id="gaT">Google Analytics · Verbindung &amp; Websites</h2><button type="button" class="btn sm ghost" id="gaX2" aria-label="Schließen">✕</button></div>
   <form id="gaF" style="display:grid;gap:14px">
    <div class="pot" style="border-style:solid"><span><b>Google-Konto</b><br><small class="muted">Nicht verbunden – im Prototyp werden Beispieldaten angezeigt.</small></span><button type="button" class="btn sm" id="gaConn">Mit Google verbinden</button></div>
    <div class="kv-edit" style="grid-template-columns:1.2fr 1fr auto"><span class="muted" style="font-size:11.5px;font-weight:600">Website</span><span class="muted" style="font-size:11.5px;font-weight:600">Mess-ID (G-…)</span><span></span></div>
    ${f.props.map((x,i)=>`<div class="kv-edit" style="grid-template-columns:1.2fr 1fr auto"><div class="inp"><input data-gp="${i}" data-f="site" value="${esc(x.site)}" placeholder="domain.de" aria-label="Website ${i+1}"></div><div class="inp"><input data-gp="${i}" data-f="mid" value="${esc(x.mid)}" placeholder="G-XXXXXXXXXX" aria-label="Mess-ID ${i+1}"></div><button type="button" class="btn sm ghost" data-gprm="${i}" aria-label="Website entfernen">✕</button></div>`).join('')}
    <button type="button" class="btn sm" id="gaAdd" style="justify-self:start">+ Website</button>
    <p class="muted" style="font-size:12px;margin:0">Die Mess-ID steht in Google Analytics unter Verwaltung → Datenstreams. Für die Auswertung braucht das Backend zusätzlich die numerische Property-ID und einen Dienstkonto-Zugang.</p>
    <div class="actions" style="justify-content:flex-end"><button type="button" class="btn ghost" id="gaCancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div>
   </form></div></div>`;
  const read=()=>$$('[data-gp]').forEach(i=>f.props[+i.dataset.gp][i.dataset.f]=i.value.trim());
  const close=()=>{gaForm=null;renderGaForm()};
  $('#gaX2').onclick=close;$('#gaCancel').onclick=close;$('#gaOv').onclick=e=>{if(e.target.id==='gaOv')close()};
  $('#gaConn').onclick=()=>toast('Google-Anmeldung folgt in der echten Anwendung (OAuth bzw. Dienstkonto)');
  $('#gaAdd').onclick=()=>{read();f.props.push({id:'w'+Date.now(),site:'',mid:'',base:20+Math.round(Math.random()*60)});renderGaForm();const l=$$('[data-gp][data-f="site"]');l[l.length-1].focus()};
  $$('[data-gprm]').forEach(b=>b.onclick=()=>{read();f.props.splice(+b.dataset.gprm,1);renderGaForm()});
  $('#gaF').onsubmit=e=>{e.preventDefault();read();const bad=f.props.find(x=>x.mid&&!/^G-[A-Z0-9]{4,}$/i.test(x.mid));
    if(bad){toast('Mess-ID „'+bad.mid+'“ hat nicht das Format G-XXXXXXXXXX');return}
    ga.props=f.props.filter(x=>x.site);if(!ga.props.some(x=>x.id===ga.sel))ga.sel=ga.props[0]?ga.props[0].id:'';saveGa();gaForm=null;renderGA();toast('Websites gespeichert')};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&gaForm){gaForm=null;renderGaForm()}});

route();
</script>

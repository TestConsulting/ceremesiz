services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      # 4000 ist auf dem Server bereits durch ProPersonalTeam belegt.
      - "127.0.0.1:4010:4000"
    volumes:
      - ./backend/data:/app/backend/data
